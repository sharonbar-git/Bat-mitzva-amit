<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>עמית — בדיקת חיבור משפחתי</title><style>body{font:16px Arial,sans-serif;background:#f5f6fb;color:#223;max-width:760px;margin:35px auto;padding:18px}main{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #0001}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px}input{border:1px solid #ccd;width:min(90%,350px)}button{background:#375a9a;color:white;border:0;cursor:pointer}li{margin:8px 0}.muted{color:#667}#error{color:#a22;white-space:pre-wrap}#list{max-height:450px;overflow:auto}</style></head><body><main><h1>טיול בת המצווה של עמית ✨</h1><p class="muted">גרסת בדיקה בלבד — לא מחליפה את האתר הקיים ולא משנה נתונים.</p><section id="login"><h2>כניסה משפחתית</h2><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="סיסמה משפחתית" required><button>כניסה</button></form></section><section id="data" hidden><h2>חיבור לנתונים בענן</h2><p id="summary"></p><button id="refresh">רענון נתונים</button><button id="logout">התנתקות</button><ol id="list"></ol></section><p id="error" role="alert"></p></main><script>
'use strict';
const ENDPOINT='https://lyubtpqyhzdkrzhrbqlu.supabase.co/functions/v1/family-api';
let token='';
const $=id=>document.getElementById(id);
async function call(action,extra={}){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch(ENDPOINT,{method:'POST',headers,body:JSON.stringify({action,...extra})});let j;try{j=await r.json()}catch{throw Error('השרת החזיר תשובה לא תקינה ('+r.status+')')}if(!r.ok)throw Error(j.error||'שגיאת שרת '+r.status);return j}
async function load(){const j=await call('load');$('summary').textContent=`נטענו ${j.places.length} יעדים מהענן · תחילת טיול: ${j.start}`;$('list').replaceChildren();for(const p of j.places){const li=document.createElement('li');li.textContent=p.name+' — '+(p.status==='must'?'חובה':'אולי')+(p.day?' · יום '+p.day:'');$('list').append(li)}}
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const b=$('form').querySelector('button');b.disabled=true;try{const j=await call('login',{password:$('password').value});token=j.token;$('password').value='';await load();$('login').hidden=true;$('data').hidden=false}catch(err){token='';$('error').textContent='הכניסה נכשלה: '+err.message}finally{b.disabled=false}};
$('refresh').onclick=async()=>{try{$('error').textContent='';await load()}catch(err){$('error').textContent=err.message}};
$('logout').onclick=()=>{token='';$('data').hidden=true;$('login').hidden=false;$('list').replaceChildren();$('summary').textContent='';$('error').textContent=''};
</script></body></html>
